<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6750A4">
  <meta name="description" content="A modern, lightweight calculator that works offline.">
  <title>Material Calculator</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
  <script src="./script.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="brand">
        <span class="material-symbols-rounded brand-icon" aria-hidden="true">calculate</span>
        <div><h1>Calculator</h1><p class="subtitle">Simple. Smart. Yours.</p></div>
      </div>
      <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme">
        <span class="material-symbols-rounded" id="theme-icon" aria-hidden="true">contrast</span>
      </button>
    </header>
    <section class="calculator" aria-label="Calculator">
      <section class="display-card" aria-label="Calculator display">
        <div class="display-top"><span class="display-label">RESULT</span><span class="material-symbols-rounded display-symbol" aria-hidden="true">functions</span></div>
        <div id="expression" class="expression" aria-label="Current expression"></div>
        <output id="result" class="result" aria-live="polite" aria-atomic="true">0</output>
      </section>
      <section class="keypad" aria-label="Calculator keypad">
        <button class="key key-utility" data-action="clear" type="button" aria-label="All clear">AC</button>
        <button class="key key-utility" data-action="delete" type="button" aria-label="Delete last character"><span class="material-symbols-rounded" aria-hidden="true">backspace</span></button>
        <button class="key key-utility" data-action="percent" type="button" aria-label="Percentage">%</button>
        <button class="key key-operator" data-value="/" type="button" aria-label="Divide">÷</button>
        <button class="key" data-value="7" type="button">7</button><button class="key" data-value="8" type="button">8</button><button class="key" data-value="9" type="button">9</button><button class="key key-operator" data-value="*" type="button" aria-label="Multiply">×</button>
        <button class="key" data-value="4" type="button">4</button><button class="key" data-value="5" type="button">5</button><button class="key" data-value="6" type="button">6</button><button class="key key-operator" data-value="-" type="button" aria-label="Subtract">−</button>
        <button class="key" data-value="1" type="button">1</button><button class="key" data-value="2" type="button">2</button><button class="key" data-value="3" type="button">3</button><button class="key key-operator" data-value="+" type="button" aria-label="Add">+</button>
        <button class="key key-utility" data-action="sign" type="button" aria-label="Change sign">+/−</button><button class="key" data-value="0" type="button">0</button><button class="key" data-action="decimal" type="button" aria-label="Decimal point">.</button><button class="key key-equals" data-action="equals" type="button" aria-label="Calculate result">=</button>
      </section>
      <footer class="calculator-footer"><span class="material-symbols-rounded" aria-hidden="true">offline_bolt</span><span>Ready whenever you are</span><span class="footer-dot" aria-hidden="true"></span><span>Works offline</span></footer>
    </section>
  </main>
</body>
</html>
